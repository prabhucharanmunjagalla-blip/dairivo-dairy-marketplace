name: dairivo
description: "Dairivo - Complete Multilingual Dairy Marketplace for Indian Farmers & Buyers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # State Management & Utils
  provider: ^6.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # Media & Hardware
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0
  flutter_svg: ^2.0.10+1

  # UI Enhancements & Notifications
  flutter_spinkit: ^5.2.1
  url_launcher: ^6.3.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
